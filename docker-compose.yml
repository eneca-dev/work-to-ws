version: '3.8'

services:
  work-to-ws:
    build: .
    container_name: work-to-ws
    restart: always

    # Порт 3003
    ports:
      - "3003:3003"

    # Подключаем .env файл с секретами
    env_file:
      - .env

    # Health check для мониторинга
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
